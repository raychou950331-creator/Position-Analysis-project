<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klein Intelligence — Market Data</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #FFFFFF; --bg2: #F8F7F5; --bg3: #F0EDE8;
      --border: rgba(0,0,0,0.08); --gold: #A8782A;
      --ink: #1A1A1A; --muted: rgba(26,26,26,0.45);
      --buy: #1A8C5B; --sell: #C0392B;
    }
    body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; min-height: 100vh; }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 60px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-links { display: flex; gap: 32px; list-style: none; }
    .nav-links a {
      font-size: 12px; font-weight: 500; letter-spacing: 0.1em;
      text-transform: uppercase; text-decoration: none;
      color: var(--muted); transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a.active { color: var(--gold); }
    .nav-status {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; letter-spacing: 0.08em;
      color: var(--buy); font-family: 'JetBrains Mono', monospace;
    }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--buy); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(26,140,91,0.5); }
      50%       { opacity: 0.7; box-shadow: 0 0 0 5px rgba(26,140,91,0); }
    }

    .hero {
      position: relative; padding: 60px 40px 40px;
      border-bottom: 1px solid var(--border);
    }
    .hero::after {
      content: ''; position: absolute; bottom: -1px; left: 40px;
      width: 220px; height: 2px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }
    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 4vw, 52px); font-weight: 900;
      line-height: 1.1; color: var(--ink);
    }
    .hero-title em { font-style: italic; color: var(--gold); }

    main { max-width: 1200px; margin: 0 auto; padding: 48px 40px 80px; }

    .index-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 36px;
    }
    .index-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 20px;
    }
    .index-name {
      font-size: 10px; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
    }
    .index-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px; font-weight: 500; color: var(--ink);
    }
    .index-change {
      font-size: 12px; margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .index-change.up { color: var(--buy); }
    .index-change.down { color: var(--sell); }

    .chart-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; padding: 24px;
    }
    .chart-top {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px;
    }
    .chart-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px; font-weight: 700;
    }
    .chart-controls { display: flex; align-items: center; gap: 8px; }
    .chart-controls input {
      padding: 6px 12px; border: 1px solid var(--border);
      border-radius: 2px; font-size: 12px; outline: none;
      font-family: 'JetBrains Mono', monospace;
      text-transform: uppercase; width: 140px;
    }
    .chart-controls button {
      padding: 6px 14px; border: 1px solid var(--border);
      border-radius: 2px; background: transparent;
      font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; cursor: pointer;
      transition: all 0.15s;
    }
    .chart-controls button:hover { border-color: var(--gold); color: var(--gold); }

    .legend {
      display: flex; gap: 16px; flex-wrap: wrap;
      font-size: 12px; color: var(--muted); margin-bottom: 12px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 24px; height: 3px; border-radius: 2px; }

    .chart-note {
      font-size: 11px; color: var(--muted);
      margin-top: 10px; letter-spacing: 0.04em;
    }

    .loading {
      text-align: center; padding: 60px;
      font-size: 13px; color: var(--muted);
    }

    footer {
      border-top: 1px solid var(--border); padding: 28px 40px;
      display: flex; justify-content: flex-end;
    }
    .footer-note { font-size: 11px; color: var(--muted); }

    @media (max-width: 768px) {
      nav, .hero, main, footer { padding-left: 20px; padding-right: 20px; }
      .index-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <nav>
    <ul class="nav-links">
      <li><a href="/">Dashboard</a></li>
      <li><a href="/market-data" class="active">Market Data</a></li>
      <li><a href="/analytics">Analytics</a></li>
    </ul>
    <div class="nav-status">
      <div class="pulse-dot"></div>
      LIVE
    </div>
  </nav>

  <section class="hero">
    <h1 class="hero-title">Market <em>Overview</em></h1>
  </section>

  <main>
    <div class="index-grid" id="indexGrid">
      <div class="loading" style="grid-column:1/-1;">載入中...</div>
    </div>

    <div class="chart-card">
      <div class="chart-top">
        <div class="chart-title">累積報酬率走勢</div>
        <div class="chart-controls">
          <input type="text" id="tickerInput" placeholder="輸入代號 AAPL" />
          <button onclick="addTicker()">新增</button>
          <button onclick="resetChart()">重設</button>
        </div>
      </div>
      <div class="legend" id="legend"></div>
      <div style="position:relative;width:100%;height:320px;">
        <canvas id="trendChart" role="img" aria-label="累積報酬率走勢圖">走勢圖載入中...</canvas>
      </div>
      <div class="chart-note">資料延遲約 15 分鐘 · 以近一個月開盤日第一天為基準（0%） · 最多可加入 3 支額外股票</div>
    </div>
  </main>

  <footer>
    <span class="footer-note">Data sourced from Yahoo Finance · Not financial advice</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const COLORS = ['#2a78d6','#eb6834','#1baf7a','#eda100'];
    const DASHES = [[0,0],[6,4],[3,3],[4,2]];
    let chartInstance = null;
    let currentSymbols = ['QQQ'];

    async function loadIndices(data) {
      const grid = document.getElementById('indexGrid');
      if (!data.length) { grid.innerHTML = '<div class="loading">無法載入大盤資料</div>'; return; }
      grid.innerHTML = data.map(d => `
        <div class="index-card">
          <div class="index-name">${d.name}</div>
          <div class="index-price">${d.price.toLocaleString()}</div>
          <div class="index-change ${d.change_pct >= 0 ? 'up' : 'down'}">
            ${d.change_pct >= 0 ? '▲' : '▼'} ${Math.abs(d.change_pct).toFixed(2)}%
          </div>
        </div>
      `).join('');
    }

    function buildLegend(symbols) {
      document.getElementById('legend').innerHTML = symbols.map((s, i) => `
        <span class="legend-item">
          <span class="legend-dot" style="background:${COLORS[i]};${DASHES[i][0]?'border-top:2px dashed '+COLORS[i]+';background:transparent;':''}"></span>
          ${s}
        </span>
      `).join('');
    }

    function buildChart(chartData) {
      if (chartInstance) chartInstance.destroy();
      const symbols = Object.keys(chartData);
      if (!symbols.length) return;

      const labels = chartData[symbols[0]].dates;
      const datasets = symbols.map((s, i) => ({
        label: s,
        data: chartData[s].returns,
        borderColor: COLORS[i],
        borderDash: DASHES[i],
        backgroundColor: 'transparent',
        borderWidth: 2,
        pointRadius: 0,
        tension: 0.3,
      }));

      chartInstance = new Chart(document.getElementById('trendChart'), {
        type: 'line',
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ctx.dataset.label + ': ' + (ctx.parsed.y >= 0 ? '+' : '') + ctx.parsed.y.toFixed(2) + '%'
              }
            }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { maxTicksLimit: 10, font: { size: 11 }, color: '#94a3b8' }
            },
            y: {
              grid: { color: 'rgba(0,0,0,0.05)' },
              ticks: {
                font: { size: 11 }, color: '#94a3b8',
                callback: v => (v >= 0 ? '+' : '') + v.toFixed(1) + '%'
              }
            }
          }
        }
      });
      buildLegend(symbols);
    }

    async function fetchData(symbols) {
      const res = await fetch('/api/market-data?symbols=' + symbols.join(','));
      return await res.json();
    }

    async function init() {
      const data = await fetchData(currentSymbols);
      loadIndices(data.indices);
      buildChart(data.chart);
    }

    async function addTicker() {
      const input = document.getElementById('tickerInput');
      const val = input.value.trim().toUpperCase();
      if (!val) return;
      if (currentSymbols.length >= 4) { alert('最多 4 條線'); return; }
      if (currentSymbols.includes(val)) { alert('已存在'); return; }
      currentSymbols.push(val);
      input.value = '';
      const data = await fetchData(currentSymbols);
      buildChart(data.chart);
    }

    async function resetChart() {
      currentSymbols = ['QQQ'];
      const data = await fetchData(currentSymbols);
      buildChart(data.chart);
    }

    init();
  </script>
</body>
</html>
